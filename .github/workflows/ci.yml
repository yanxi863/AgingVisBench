name: public-repo-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
      - name: Check public boundary
        run: python scripts/check_public_repo.py
      - name: Smoke-test CLI
        run: |
          python processing/run_full_audit_pipeline.py --help
          python processing/run_full_audit_pipeline.py --stage status --config config/pipeline.example.yml
          python processing/run_full_audit_pipeline.py --stage all --config config/pipeline.example.yml --dry-run --max-images 1 --skip-api
