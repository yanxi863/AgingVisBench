version: "0.5"
benchmark: "AgingVisBench"
language: "zh-main-en-auxiliary"

# Core benchmark indicators follow the user's thesis structure:
# - Scene / social-positioning variables: 2
# - Action Layer (A): 5
# - Resonance Layer (R): 5
# Some additional variables are retained as intermediate/process variables only.

metric_groups:
  scene_social_positioning:
    label_zh: "场景与社会位置"
    label_en: "Scene and Social Positioning"
    core_count: 2
    role: core
    metrics:
      - id: scene_type
        code: S1
        label_zh: "场景类型"
        label_en: "Scene type"
        layer: scene
        type: categorical
        values: [home, office, hospital, street, park, yard, outdoor_other, unknown]
        extraction: "VLM semantic coding + rule-based cleaning"
        human_review: recommended
        reliability_tier: high
        reliability_source: "reports/reliability_summary.csv; n=200, kappa=0.976"
        adjudication_priority: core
        bias_relevance:
          - domesticity
          - institutionalization
          - public_space_exclusion
        notes: "Home, yard, or hospital scenes are not inherently biased; risk depends on stable spatial compression with other evidence."

      - id: is_alone
        code: S2
        label_zh: "是否独处"
        label_en: "Being alone"
        layer: scene
        type: binary
        values: [0, 1]
        extraction: "YOLO person count + semantic/rule interpretation"
        human_review: recommended
        reliability_tier: insufficient
        reliability_source: "No direct human-agreement result in the published V0.5 summary."
        adjudication_priority: core
        bias_relevance:
          - social_isolation
          - social_connection
        notes: "Single-person images are not automatically loneliness; interpret with scene and action context."

  action_layer:
    label_zh: "行动层"
    label_en: "Action Layer (A)"
    abbreviation: A
    core_count: 5
    role: core
    metrics:
      - id: development_oriented_agency
        code: A1
        label_zh: "发展导向行为"
        label_en: "Development-oriented agency"
        layer: A
        type: binary
        values: [0, 1]
        extraction: "VLM semantic coding + rule-based recoding"
        human_review: required
        reliability_tier: high
        reliability_source: "reports/reliability_summary.csv; n=200, kappa=0.878"
        adjudication_priority: core
        process_variables: [action_type, primary_action, agency_orientation]
        bias_relevance:
          - agency_compression
          - maintenance_orientation
          - active_ageing_tension
        notes: "Do not interpret as active/passive; the key contrast is development/growth/social participation vs maintenance/routine care."

      - id: bhi
        code: A2
        label_zh: "身体姿态收缩指数"
        label_en: "Body hunch index / body posture contraction index"
        layer: A
        type: continuous
        extraction: "MediaPipe pose features"
        human_review: technical_qa
        reliability_tier: unassessed
        reliability_source: "Technical QA measure; no human-agreement tier is published."
        adjudication_priority: core_supporting
        process_variables: [spine_angle, arm_curl, leg_curl, face_detected]
        bias_relevance:
          - posture_representation
        notes: "A-layer measured variable, but not a standalone bias indicator."

      - id: modern_object
        code: A3
        label_zh: "科技生活符号"
        label_en: "Modern or technological life symbol"
        layer: A
        type: binary
        values: [0, 1]
        extraction: "VLM object coding + rule-based cleaning"
        human_review: recommended
        reliability_tier: medium
        reliability_source: "reports/reliability_summary.csv; n=200, kappa=0.789"
        adjudication_priority: core
        process_variables: [objects]
        bias_relevance:
          - digital_exclusion
          - modern_life_exclusion
          - demodernization

      - id: traditional_cultural_marker
        code: A4
        label_zh: "传统文化符号"
        label_en: "Traditional cultural marker"
        layer: A
        type: binary
        values: [0, 1]
        extraction: "VLM object/scene coding + rule-based cleaning"
        human_review: recommended
        reliability_tier: high
        reliability_source: "reports/reliability_summary.csv; n=200, kappa=0.900"
        adjudication_priority: core
        process_variables: [objects, scene_type]
        bias_relevance:
          - traditionalization
          - cultural_stereotyping
          - demodernization
        notes: "Traditional markers are not inherently negative; adjudication requires context and evidence."

      - id: rural_scene
        code: A5
        label_zh: "乡村生活符号"
        label_en: "Rural-life symbol"
        layer: A
        type: binary
        values: [0, 1]
        extraction: "Derived from visible-cue urban_rural_scene audit"
        human_review: required
        reliability_tier: high
        reliability_source: "reports/reliability_summary.csv; n=200, kappa=0.952"
        adjudication_priority: core
        process_variables: [urban_rural_scene, urban_scene]
        bias_relevance:
          - ruralization
          - culturalized_ageing
          - nationality_intersection
        notes: "Derived from urban_rural_scene == rural. Unknown_or_mixed must not be forced into rural/urban."

  resonance_layer:
    label_zh: "共鸣层"
    label_en: "Resonance Layer (R)"
    abbreviation: R
    core_count: 5
    role: core
    metrics:
      - id: bg_brightness
        code: R1
        label_zh: "背景亮度"
        label_en: "Background brightness"
        layer: R
        type: continuous
        extraction: "Traditional computer vision feature extraction"
        human_review: technical_qa
        reliability_tier: unassessed
        reliability_source: "Technical QA measure; no human-agreement tier is published."
        adjudication_priority: supporting
        bias_relevance:
          - visual_atmosphere

      - id: bg_saturation
        code: R2
        label_zh: "背景饱和度"
        label_en: "Background saturation"
        layer: R
        type: continuous
        extraction: "Traditional computer vision feature extraction"
        human_review: technical_qa
        reliability_tier: unassessed
        reliability_source: "Technical QA measure; no human-agreement tier is published."
        adjudication_priority: supporting
        bias_relevance:
          - visual_atmosphere

      - id: image_entropy_background
        code: R3
        label_zh: "背景信息熵"
        label_en: "Background image entropy"
        layer: R
        type: continuous
        extraction: "Traditional computer vision feature extraction"
        human_review: technical_qa
        reliability_tier: unassessed
        reliability_source: "Technical QA measure; no human-agreement tier is published."
        adjudication_priority: supporting
        bias_relevance:
          - visual_complexity

      - id: center_distance
        code: R4
        label_zh: "视觉中心距离"
        label_en: "Distance from image center"
        layer: R
        type: continuous
        extraction: "YOLO bounding box center distance"
        human_review: technical_qa
        reliability_tier: unassessed
        reliability_source: "Technical QA measure; no human-agreement tier is published."
        adjudication_priority: supporting
        bias_relevance:
          - compositional_marginalization

      - id: area_ratio
        code: R5
        label_zh: "人物占图像比"
        label_en: "Person area ratio"
        layer: R
        type: continuous
        extraction: "YOLO bounding box area / image area"
        human_review: technical_qa
        reliability_tier: unassessed
        reliability_source: "Technical QA measure; no human-agreement tier is published."
        adjudication_priority: supporting
        bias_relevance:
          - visual_marginalization

intermediate_variables:
  - id: action_type
    label_zh: "主要行动类型"
    role: "process"
    used_for: [development_oriented_agency, case_interpretation, narrative_signature]
    reason_not_core: "open-text/categorical process variable; used to derive and interpret development-oriented behavior"

  - id: primary_action
    label_zh: "主要行动"
    role: "process"
    used_for: [development_oriented_agency, case_interpretation]
    reason_not_core: "process field for action recoding"

  - id: agency_orientation
    label_zh: "主体性取向"
    role: "process"
    used_for: [development_oriented_agency, action_layer_interpretation]
    reason_not_core: "upstream explanatory variable for development-oriented behavior"

  - id: space_type
    label_zh: "空间类型"
    role: "process/supporting"
    used_for: [scene_type_interpretation, signature_analysis]
    reason_not_core: "supports scene interpretation but is not one of the final two scene/social-positioning variables"

  - id: environment_type
    label_zh: "环境类型"
    role: "process/supporting"
    used_for: [scene_cleaning]
    reason_not_core: "overlaps with scene and space coding"

  - id: urban_rural_scene
    label_zh: "城乡场景"
    role: "process"
    values: [rural, urban, unknown_or_mixed]
    used_for: [rural_scene, urban_scene, urban_rural_evidence]
    reason_not_core: "three-category coding source; final A-layer core metric is rural-life symbol"

  - id: urban_scene
    label_zh: "城市场景"
    role: "process/supporting"
    used_for: [urban_rural_evidence]
    reason_not_core: "used as contrast for rural_scene, not a primary A-layer metric"

  - id: objects
    label_zh: "物体列表"
    role: "process/supporting"
    used_for: [modern_object, traditional_cultural_marker, medical_object, case_interpretation]
    reason_not_core: "open vocabulary field"

  - id: has_medical_object
    label_zh: "医疗或辅助物体"
    role: "supporting"
    used_for: [medicalization_interpretation, model_profile]
    reason_not_core: "important supporting variable but not one of the specified A/R core variables"

  - id: medical_object_count
    label_zh: "医疗或辅助物体数量"
    role: "supporting"
    used_for: [medicalization_interpretation]
    reason_not_core: "supporting count variable"

  - id: num_persons
    label_zh: "人物数量"
    role: "process"
    used_for: [is_alone]
    reason_not_core: "used to derive or validate being-alone variable"

  - id: spine_angle
    role: "process"
    used_for: [bhi]
    reason_not_core: "pose subfeature"

  - id: arm_curl
    role: "process"
    used_for: [bhi]
    reason_not_core: "pose subfeature"

  - id: leg_curl
    role: "process"
    used_for: [bhi]
    reason_not_core: "pose subfeature"

adjudication_entry_conditions:
  - "statistically_significant_age_difference"
  - "effect_size_reaches_threshold"
  - "consistent_direction_in_multiple_models"
  - "stable_gender_or_nationality_intersection"
  - "potential_negative_direction: lower development-oriented behavior, lower technological life symbol, higher traditional/rural/medicalized coding, more being-alone, or R-layer visual marginalization"

risk_output_fields:
  - risk_level
  - evidence_confidence
  - statistical_evidence
  - reliability_evidence
  - real_world_evidence
  - theoretical_evidence
  - counter_interpretation
  - final_rationale
  - limitations
